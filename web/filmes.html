<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Organize seus filmes e séries com o CineList."
    />
    <title>CineList | Filmes e séries</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./filmes.html" aria-label="CineList, início">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span>CineList</span>
      </a>
      <a
        class="api-link"
        href="https://cinelist-backend.vercel.app/docs"
        target="_blank"
        rel="noreferrer"
      >
        Documentação da API
      </a>
    </header>

    <main class="page">
      <section class="intro">
        <div>
          <p class="eyebrow">Sua coleção, do seu jeito</p>
          <h1>Filmes e séries</h1>
          <p class="intro-copy">
            Guarde o que você quer assistir e acompanhe o que já viu.
          </p>
        </div>
        <button class="button button-primary" id="new-film-button" type="button">
          <span aria-hidden="true">+</span>
          Adicionar título
        </button>
      </section>

      <section class="library" aria-labelledby="library-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Biblioteca</p>
            <h2 id="library-title">Minha lista</h2>
          </div>
          <p class="film-count" id="film-count">Carregando...</p>
        </div>

        <div class="filters">
          <label class="search-field">
            <span class="sr-only">Buscar título ou gênero</span>
            <span class="search-icon" aria-hidden="true"></span>
            <input
              id="search-input"
              type="search"
              placeholder="Buscar título ou gênero"
              autocomplete="off"
            />
          </label>

          <label class="filter-field">
            <span class="sr-only">Filtrar por tipo</span>
            <select id="type-filter">
              <option value="">Todos os tipos</option>
            </select>
          </label>

          <label class="filter-field">
            <span class="sr-only">Filtrar por status</span>
            <select id="status-filter">
              <option value="">Todos os status</option>
            </select>
          </label>
        </div>

        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
        <div class="film-grid" id="film-grid" aria-live="polite"></div>
      </section>
    </main>

    <dialog class="film-dialog" id="film-dialog" aria-labelledby="form-title">
      <form class="film-form" id="film-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">Sua biblioteca</p>
            <h2 id="form-title">Adicionar título</h2>
          </div>
          <button
            class="icon-button"
            id="close-dialog-button"
            type="button"
            aria-label="Fechar formulário"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>

        <input id="film-id" name="id" type="hidden" />

        <label class="form-field form-field-wide">
          <span>Título</span>
          <input
            name="titulo"
            type="text"
            maxlength="120"
            placeholder="Ex.: Interestelar"
            required
          />
        </label>

        <div class="form-row">
          <label class="form-field">
            <span>Tipo</span>
            <select name="tipo" id="film-type" required></select>
          </label>

          <label class="form-field">
            <span>Ano</span>
            <input name="ano" type="number" min="1888" max="2100" required />
          </label>
        </div>

        <div class="form-row">
          <label class="form-field">
            <span>Gênero</span>
            <input
              name="genero"
              type="text"
              maxlength="60"
              placeholder="Ex.: Ficção científica"
              required
            />
          </label>

          <label class="form-field">
            <span>Status</span>
            <select name="status" id="film-status" required></select>
          </label>
        </div>

        <label class="form-field form-field-wide">
          <span>URL da imagem</span>
          <input
            name="imagem"
            type="url"
            maxlength="2048"
            placeholder="https://..."
            required
          />
        </label>

        <label class="form-field form-field-wide">
          <span>Descrição <span class="optional">(opcional)</span></span>
          <textarea
            name="descricao"
            rows="3"
            maxlength="1000"
            placeholder="Uma breve descrição"
          ></textarea>
        </label>

        <label class="form-field">
          <span>Nota <span class="optional">(0 a 10)</span></span>
          <input
            name="nota"
            type="number"
            min="0"
            max="10"
            step="0.1"
            placeholder="Sem nota"
          />
        </label>

        <p class="form-error" id="form-error" role="alert"></p>

        <div class="form-actions">
          <button class="button button-quiet" id="cancel-button" type="button">
            Cancelar
          </button>
          <button class="button button-primary" id="save-button" type="submit">
            Salvar título
          </button>
        </div>
      </form>
    </dialog>
  </body>
</html>
